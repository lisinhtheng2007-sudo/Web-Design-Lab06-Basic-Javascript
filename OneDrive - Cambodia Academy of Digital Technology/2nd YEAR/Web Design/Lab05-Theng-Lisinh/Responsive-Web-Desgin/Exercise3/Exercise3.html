<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive With Flex layout</title>
    <style>
        .box{
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }
        header{
            background-color: black;
            color: white;
            padding:1rem;
            text-align: center;
        }
        footer{
            background-color: black;
            color: white;
            padding:1rem;
            text-align: center;
        }
        .container{
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            padding: 0.8rem;
        }
        .main{
            background-color: rgb(121, 214, 214);
            padding:1rem;
        }
        .sidebar{
            background-color: brown;
            padding:1rem;
        }
        @media (min-width: 600px) and (max-width: 900px){
            .container{
                display: grid;
                grid-template-columns: repeat(2,1fr);
                gap: 1rem;
                padding: 0.7rem;
            }
            .box{
                display: flex;
                flex-direction: column;
                gap: 0.1rem;
            }
        }
        @media (min-width: 900px){
            .container{
                display: grid;
                grid-template-columns: 2fr 1fr;
            }
            header{
                padding:2rem;
            }
            footer{
                padding:2rem;
            }
        }
    </style>
</head>
<body>
    <div class="box">
        <header>Responsive Header</header>
        <div class="container">
            <div class="main">Main Content</div>
            <div class="sidebar">Sidebar</div>
        </div>
        <footer>Footer</footer>
    </div>
</body>
</html>
