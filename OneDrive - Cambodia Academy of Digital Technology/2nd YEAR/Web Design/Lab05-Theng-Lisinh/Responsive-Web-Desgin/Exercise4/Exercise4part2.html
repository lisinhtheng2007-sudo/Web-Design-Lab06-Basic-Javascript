<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive With Flex layout</title>
    <style>
        .wrapper{
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .content{
            background-color: greenyellow;
            width: clamp(300px,100%,800px);
            height: 100vh;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="content">
        </div>
    </div>
</body>
</html>
