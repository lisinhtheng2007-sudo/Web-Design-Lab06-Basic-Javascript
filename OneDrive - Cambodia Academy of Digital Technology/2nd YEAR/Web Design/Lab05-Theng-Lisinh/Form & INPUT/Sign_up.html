<!DOCTYPE html>
<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Create Account</title>
        <style>
            body{
            background-color:rgb(0, 62, 62);
            margin: 20px;
        }

        .container{
            display:flex;
            flex-direction: column;
            background-color: whitesmoke;
            border-radius: 10px;
        }
        .head{
            border-radius: 10px 10px 0 0;
            text-align: center;
            background-color: rgb(193, 192, 192);
            color: rgb(91, 91, 91);
            font-size: 24px;
            font-weight: bold;
            padding:20px;
        }
        .middle{
            display:flex;
            flex-direction: column;
            color: rgb(0, 194, 149);
            margin:20px;
            gap:20px;
        }
        .name, .password, .gender, .source, .file{
            display:flex;
            justify-content: space-between;
            gap:10px;
            
        }
        .name label, .password label, .source label, .file label{
            flex:1;
        }
        .name input, .password input,.email input, .source select, .source input, .file input, .bio textarea{
            width: 100%;     
            box-sizing: border-box;
        }
        .email{
            display:block;
        }
        .gender label{
            flex:1;
            flex-direction: row;
        }

        .footer{
            border-radius: 0 0 10px 10px;
            background-color: rgb(193, 192, 192);
            padding:20px;
            display: flex;
            justify-content: flex-end;
        }

        .footer button{
            background-color:rgb(0, 194, 149) ;
            padding:10px;
            border-radius: 10px;
            width: 100px;
            color: white;
            border: none;
        }

        </style>
    </head>
    <body>
        <div class="container">
            <div class="head">Sign Up</div>

            <div class="middle">
                <div class="name">
                    <label>
                        First name*<br>
                        <input type="text" placeholder="e.g. Alex">
                    </label>
                    <label>
                        Last name*<br>
                        <input type="text" placeholder="e.g. Morgan">
                    </label>
                </div>

                <label class="email">Email address*<br>
                    <input type="email" placeholder="alex.morgan@example.com">
                </label>

                <div class="password">
                    <label>
                        Password*<br>
                        <input type="text" placeholder="Create a strong password">
                    </label>
                    <label>
                        Confirm Password*<br>
                        <input type="text" placeholder="Re-enter your password">
                    </label>
                </div>

                <div class="gender">
                    <label>
                        Gender<br>
                        <input type="radio" value="male">
                        <label>Male</label>
                        <input type="radio" value="female">
                        <label>Female</label>
                    </label>
                    <label>
                        Hobby<br>
                        <input type="checkbox">
                        <label>Gaming</label>
                        <input type="checkbox">
                        <label>Photography</label>
                        <input type="checkbox">
                        <label>Cooking</label>
                    </label>
                </div>

                <div class="source">
                    <label>
                        Employment Status<br>
                        <select>
                            <option>Full-time Employee</option>
                            <option>Freelancer</option>
                            <option>Business Owner</option>
                            <option>Student</option>
                        </select>
                    </label>
                    <label>
                        Income Range<br>
                        <input type="range" min="0" max="1000">
                    </label>
                </div>

                <div class="file">
                    <label>
                        Upload Avatar<br>
                        <input type="file">
                    </label>
                    <label>
                        Age<br>
                        <input type="text" placeholder="e.g. 25">
                    </label>
                </div>
                <div class="bio">
                    <label>
                        Bio<br>
                        <input type="text" style="display:none;">
                        <textarea rows="4" placeholder="Tell us a little bit about yourself..."></textarea>
                    </label>
                </div>
            </div>
            <div class="footer">
                <button>Register</button>
            </div>
        </div>
    </body>
</html>
